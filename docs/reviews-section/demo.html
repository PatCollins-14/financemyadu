<style>
.rv{--rv-navy:#223d78;--rv-band:#2c4d95;--rv-blue:#1a6fb0;--rv-sky:#399cda;--rv-gold:#f0b82e;--rv-gold2:#dfa529;--rv-star:#f5a300;

.rv *,.rv *::before,.rv *::after{box-sizing:border-box}
.rv{background:radial-gradient(circle at 10% 0%,rgba(82,175,230,.22),rgba(82,175,230,0) 38%),var(--rv-tint);border:1px solid var(--rv-line);

.rv>*{min-width:0}
.rv-kicker{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:#946600;margin:0 0 14px}
.rv-kicker::before{content:"";width:34px;height:2px;background:var(--rv-gold)}
.rv-title{margin:0;font-size:clamp(30px,3.8vw,48px);font-weight:300;line-height:1.06;letter-spacing:-.035em;max-width:15em}
.rv-title em{font-style:normal;color:#1f86cf}
.rv-intro h3{margin:0 0 6px;font-size:20px;font-weight:500;color:var(--rv-navy)}
.rv-intro p{margin:0;font-size:15px;color:var(--rv-soft)}
.rv-plats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}
.rv-plat{display:grid;gap:5px;justify-items:start;align-content:start;padding:16px 18px 14px;background:var(--rv-card);border:1px solid var(--rv-line);border-radius:18px;
  text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;min-width:0}
.rv-plat:hover{transform:translateY(-2px);border-color:var(--rv-sky);box-shadow:0 12px 24px -16px rgba(34,61,120,.5)}
.rv-plogo-box{display:flex;align-items:center;height:30px}
.rv-plogo{display:block;width:108px;height:28px;max-width:100%;object-fit:contain;object-position:left center}
.rv-wm{font-weight:800;letter-spacing:-.04em;color:#808080;font-size:25px;line-height:28px}
.rv-rate{position:relative;display:inline-block;font-size:19px;letter-spacing:2px;line-height:1;white-space:nowrap}
.rv-rate .bg{color:#d5dbe5}.rv-rate .fg{position:absolute;left:0;top:0;overflow:hidden;color:var(--rv-star);white-space:nowrap}
.rv-score{font-size:13px;color:var(--rv-soft)}.rv-score b{font-size:22px;font-weight:600;letter-spacing:-.03em;color:var(--rv-navy);margin-right:3px}
.rv-count{font-size:13px;color:var(--rv-soft)}
.rv-link{margin-top:4px;font-size:12px;font-weight:600;color:var(--rv-blue)}
.rv-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.rv-bar h3{margin:0;font-size:20px;font-weight:500;color:var(--rv-navy)}
.rv-ctl{display:flex;gap:8px}.rv-ctl[hidden]{display:none}
.rv-arrow{width:44px;height:44px;border-radius:50%;border:1px solid #c3d2e6;background:#fff;color:var(--rv-navy);font:600 18px/1 inherit;cursor:pointer;padding:0}
.rv-arrow:hover:not(:disabled){background:var(--rv-navy);color:#fff;border-color:var(--rv-navy)}.rv-arrow:disabled{opacity:.35;cursor:default}
.rv-track{position:relative;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 22px;margin:0 -2px;scrollbar-width:thin;scrollbar-color:#b9c9de transparent;align-items:stretch}
.rv-card{flex:0 0 calc((100% - 36px) / 3);scroll-snap-align:start;background:var(--rv-card);border:1px solid #dbe7f3;border-radius:22px;padding:24px;display:flex;flex-direction:column;
  gap:16px;min-width:0;min-height:260px;box-shadow:0 14px 30px -22px rgba(34,61,120,.45)}
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rv-stars{letter-spacing:2px;font-size:16px;color:#e0a000}
.rv-unrated{font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--rv-soft);font-weight:700}.rv-source{font-size:13px;font-weight:600;color:var(--rv-blue);text-decoration:underline;text-underline-offset:3px;align-self:start}
.rv-src img{display:block;height:18px;width:68px;object-fit:contain;object-position:right center}
.rv-src .rv-wm{font-size:17px;line-height:18px}
.rv-text{margin:0;font-size:16px;line-height:1.55;flex:1 1 auto}
.rv-author{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:4px}
.rv-avatar{flex:none;width:42px;height:42px;border-radius:50%;background:var(--rv-navy);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.rv-avatar.a1{background:#1a6fb0}.rv-avatar.a2{background:#4a5aa8}.rv-avatar.a3{background:#8a6200}.rv-avatar.a4{background:#2a7a96}
.rv-author b{display:block;font-size:15px;font-weight:600;color:var(--rv-navy)}.rv-author span.m{font-size:13px;color:var(--rv-soft)}
.rv-dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.rv-dots[hidden]{display:none}
.rv-dot{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:#c3d2e6;cursor:pointer}.rv-dot.on{background:var(--rv-navy);width:26px;border-radius:6px}
.rv-dots.count{font-size:13px;font-weight:600;color:var(--rv-soft)}
.rv-blur{display:inline-block;filter:blur(5px);user-select:none;pointer-events:none;opacity:.85}
.rv-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rv-embeds:empty{display:none}.rv-embeds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.rv-embed{background:var(--rv-card);border:1px solid #dbe7f3;border-radius:22px;padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.rv-embed h4{margin:0;font-size:18px;color:var(--rv-navy)}.rv-embed p{margin:0;font-size:13px;color:var(--rv-soft)}
.rv-btn{justify-self:start;font:600 15px/1 inherit;border-radius:12px;padding:13px 20px;border:1px solid #c3d2e6;background:#fff;color:var(--rv-navy);cursor:pointer}
.rv-slot{min-width:0;overflow:auto}
.rv-note{margin:0;font-size:13px;color:var(--rv-soft);max-width:92ch}.rv-note a{color:var(--rv-blue);font-weight:600}
.rv :focus-visible{outline:2px solid var(--rv-sky);outline-offset:2px}

@media (max-width:640px){.rv-card{flex-basis:84%}.rv-plats{grid-template-columns:1fr 1fr}}
@media (max-width:380px){.rv-plats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rv *{transition:none!important}}
</style>

<script>

      var box = el('div', 'rv-embed'); box.appendChild(el('h4', '', e.name + ' reviews'));
      var btn = el('button', 'rv-btn', 'Show ' + e.name + ' reviews'); btn.type = 'button';

        slot.hidden = false; btn.hidden = true; wait.hidden = true;
      });

    });
    root.querySelector('.rv-note').textContent = D.note || '';
    if (!D.note) root.querySelector('.rv-note').hidden = true;

    if (!cards.length) { root.querySelector('.rv-carousel').hidden = true; return; }
